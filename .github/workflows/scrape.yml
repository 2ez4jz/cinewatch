name: Refresh IMAX 70mm data

on:
  push:
    paths:
      - "scripts/scrape.mjs"
      - ".github/workflows/scrape.yml"
  schedule:
    - cron: "*/5 * * * *"
    - cron: "17 8 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: Scan range
        type: choice
        options: [quick, deep]
        default: quick

permissions:
  contents: write

concurrency:
  group: cinewatch-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Select scan mode
        id: scan
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            mode=deep
          elif [ "${{ github.event.schedule }}" = "17 8 * * *" ]; then
            mode=deep
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            mode="${{ inputs.mode }}"
          else
            mode=quick
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
      - name: Refresh showtimes and seats
        env:
          SCRAPE_MODE: ${{ steps.scan.outputs.mode }}
          CINEPLEX_SUBSCRIPTION_KEY: ${{ secrets.CINEPLEX_SUBSCRIPTION_KEY }}
        run: node scripts/scrape.mjs
      - name: Save refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/showtimes.json
          git diff --cached --quiet || git commit -m "data: refresh IMAX 70mm seats"
          git pull --rebase
          git push
